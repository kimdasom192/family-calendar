<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 가족달력</title>
<meta name="theme-color" content="#3E7A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky header (month + view tabs + filter chips) → view body → fixed quick-input dock at the bottom; sheets slide up for edits. */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --surface2:#EAF0E7; --ink:#1D2A21; --muted:#66756A; --line:#D9E2D5;
  --accent:#3E7A4D; --accent-ink:#FFFFFF; --sun:#C8443E; --sat:#3568B0;
  --c-me:#D25C74; --c-hus:#3474BE; --c-couple:#8259C4; --c-kid1:#1B9AA8; --c-kid2:#E0742A; --c-kids:#C99A12; --c-family:#2C9466; --c-work:#2E3C55; --c-elder:#9A6247;
  --tint:12%;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1A221D; --surface2:#222C25; --ink:#E6EDE6; --muted:#97A69A; --line:#2E3A31;
  --accent:#7DBE8B; --accent-ink:#0F1A12; --sun:#F07C74; --sat:#7EA8EA;
  --c-me:#F08AA0; --c-hus:#6FA5E8; --c-couple:#B092F0; --c-kid1:#55CBD6; --c-kid2:#F59A5E; --c-kids:#E8C34E; --c-family:#5FC896; --c-work:#9FB0CF; --c-elder:#D9A486;
  --tint:22%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1A221D; --surface2:#222C25; --ink:#E6EDE6; --muted:#97A69A; --line:#2E3A31;
  --accent:#7DBE8B; --accent-ink:#0F1A12; --sun:#F07C74; --sat:#7EA8EA;
  --c-me:#F08AA0; --c-hus:#6FA5E8; --c-couple:#B092F0; --c-kid1:#55CBD6; --c-kid2:#F59A5E; --c-kids:#E8C34E; --c-family:#5FC896; --c-work:#9FB0CF; --c-elder:#D9A486;
  --tint:22%; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior-y:contain}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
.brand{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bell{flex:none;height:38px;border:0;border-radius:999px;padding:0 12px;background:var(--sun);color:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.newtag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--surface);background:var(--sun);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.ev.isnew{outline:1.5px solid var(--sun);outline-offset:-1px}
.sync{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;letter-spacing:0;background:var(--surface2);color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sync.who{color:var(--ink);background:var(--surface2)}
.sync.who::before{display:none}
.whopick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whopick button{border:2px solid var(--c);color:var(--c);background:none;border-radius:12px;padding:14px;font-size:17px;font-weight:600}
.whopick button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.sync.bad{color:var(--surface);background:var(--sun)}
.sync.bad::before{background:var(--surface)}
.title{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.grow{flex:1;min-width:0}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{background:var(--c-work);color:var(--surface);border-color:var(--c-work)}
.trow{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.nav{display:flex;gap:4px;margin-left:auto;flex:none}
.ntick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:999px;padding:0 12px;text-align:left}
.ntick .lbl{flex:none;font-size:12px;font-weight:600;color:var(--accent)}
.ntick .txt{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntick .txt.muted{color:var(--muted)}
.ntick:empty{visibility:hidden}
.caret{font-size:10px;opacity:.7}
.pop{position:fixed;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.16);padding:6px;max-height:240px;overflow-y:auto;min-width:180px;display:flex;flex-direction:column;gap:2px}
.pop button{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;font-size:14px}
.pop button[aria-pressed="true"]{background:var(--surface2);font-weight:600}
.pop button:hover{background:var(--surface2)}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.search{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 10px;width:120px}
.search input{border:0;background:none;outline:0;width:100%;padding:4px 0;font-size:13px}

/* banner */
.note{margin-top:10px;padding:8px 12px;border-radius:var(--r);background:var(--surface2);color:var(--muted);font-size:13px}
.note[hidden]{display:none}

main{padding-block:12px 220px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--surface2);text-align:center;font-size:11px;font-weight:600;padding:5px 0;color:var(--muted)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{background:var(--surface);min-height:84px;padding:4px 3px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left;align-items:stretch}
.cell.out{background:var(--bg)} .cell.out .dn{opacity:.4}
.dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;min-width:0}
.dn.sun{color:var(--sun)} .dn.sat{color:var(--sat)}
.cell.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.hname{font-size:9px;font-weight:500;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{font-size:10px;letter-spacing:-.02em;font-weight:600;color:var(--surface);background:var(--c-work);border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wk.off{background:none;color:var(--c-work);border:1px dashed var(--c-work)}
.ev.multi{box-shadow:inset 2px 0 0 var(--c2);background:linear-gradient(90deg,color-mix(in srgb,var(--c) var(--tint),transparent),color-mix(in srgb,var(--c2) var(--tint),transparent))}
.tag .dot+.dot{margin-left:-3px}
.ev{font-size:10px;line-height:1.35;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) var(--tint),transparent);border-left:2px solid var(--c)}
.more{font-size:10px;color:var(--muted);padding-left:3px}
.cell.pick{outline:2px solid var(--c-work);outline-offset:-2px}

/* lists (week, day, search) */
.days{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dhead{display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--surface2);border:0;width:100%;text-align:left}
.dhead .d{font-weight:600;font-variant-numeric:tabular-nums}
.dhead .t{font-size:12px;color:var(--muted)}
.dhead.today{background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;align-items:start}
.items .item:first-child{border-top:0}
.tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.it{min-width:0;display:flex;flex-direction:column;gap:2px}
.it .nm{font-weight:500;overflow-wrap:anywhere}
.it .memo{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--c);font-weight:600}
.item.work{background:color-mix(in srgb,var(--c-work) 9%,transparent)}
.empty{padding:12px;color:var(--muted);font-size:13px}
.notices{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.nhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.nhead .lbl{font-weight:600;color:var(--accent);letter-spacing:.04em}
.nhead .cnt{font-size:12px;color:var(--muted)}
.nhead .add{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 4px}
.nitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px}
.nitem:first-child{border-top:0}
.nitem .nt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nitem .nd{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.nitem .nd.soon{color:var(--sun);font-weight:600}
.av{font-size:10px;font-weight:600;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.item.anniv{background:color-mix(in srgb,var(--c) 8%,transparent)}
.abar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.alist .nitem .nt{-webkit-line-clamp:1}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.emo-row{display:flex;align-items:center;gap:10px}
.emo-cur{width:44px;height:44px;border-radius:12px;border:1px dashed var(--line);background:var(--bg);font-size:22px;color:var(--muted)}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;background:var(--bg);border-radius:12px;padding:8px;max-height:200px;overflow-y:auto}
.emo-grid button{height:40px;border:0;border-radius:8px;background:none;font-size:20px}
.emo-grid button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.emo-grid button.none{font-size:11px;color:var(--muted)}
.hback{flex:none;height:38px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 14px 0 11px;font-weight:600;font-size:14px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;margin-bottom:10px}
.addday{width:100%;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--accent);border-radius:var(--r);padding:11px;font-weight:600;margin-top:10px}
.kindtabs{display:flex;gap:6px;flex-wrap:wrap}
.kindtabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.kindtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swl{animation:swl .2s ease-out}.swr{animation:swr .2s ease-out}.swu{animation:swu .22s ease-out}.swd{animation:swd .22s ease-out}
@keyframes swl{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swu{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swd{from{transform:translateY(-40px);opacity:.3}to{transform:none;opacity:1}}
.swipehint{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
.nmore{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:7px;font-size:12px;color:var(--muted)}
.dayhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:10px}
.dayhero h2{font-family:var(--f-display);font-size:22px;margin:0}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted)}
.pill.hol{color:var(--sun)}
.workcard{display:flex;align-items:center;gap:12px;background:var(--c-work);color:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border:0;width:100%;text-align:left}
.workcard .big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.workcard .sub{font-size:12px;opacity:.85}
.workcard.none{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:16px 0 6px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgb(0 0 0/.06)}
.dock .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.prev{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto}
.pv{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.pv .pd{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pv .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .hint{font-size:11px;color:var(--muted);white-space:nowrap}
.cbtn{flex:none;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),transparent);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:15px;line-height:1.4;max-height:120px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 16px;height:42px;font-weight:600;flex:none}
.primary:disabled{opacity:.45}
.help{font-size:11px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:center;gap:8px}
.sh h3{margin:0;font-size:17px;flex:1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px}
.danger{border:1px solid var(--sun);color:var(--sun);background:none;border-radius:10px;padding:9px 14px}
.danger.arm{background:var(--sun);color:var(--surface)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--c);color:var(--c);background:none;border-radius:999px;padding:4px 11px;font-size:13px}
.catpick button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.course{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column}
.course b{font-size:15px}
.course span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.course[aria-pressed="true"]{background:var(--c-work);color:var(--surface);border-color:var(--c-work)}
.course[aria-pressed="true"] span{color:inherit;opacity:.85}
.tabs3{display:flex;gap:6px}
.tabs3 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px}
.tabs3 button[aria-pressed="true"]{background:var(--c-work);color:var(--surface);border-color:var(--c-work)}
.rtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.rtable th{color:var(--muted);font-weight:500;font-size:12px}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;max-width:90vw}
@media (min-width:700px){.cell{min-height:104px} .ev{font-size:11px} .search{width:180px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.login .box{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-size:30px;margin:0;line-height:1.2}
.login p{margin:0;color:var(--muted)}

  // 제목 정리: 이름·조사·연결어 제거
  const nameWords = [...words.hus, ...words.kid1, ...words.kid2, ...words.me].join('|');
  s = s.replace(new RegExp(`(^|\\s)(${nameWords})${P}(?=\\s|$|[,·])`,'g'), ' ');
  s = s.replace(/(^|\s)(아이들|애들)(이랑|하고|은|는|이|의)?(?=\s|$)/g, ' ');
  s = s.replace(/(^|\s)(에|에는|부터|까지|~|-)(?=\s|$)/g, ' ').replace(/\s+/g,' ').trim().replace(/^[,·:]+|[,·:]+$/g,'').trim();
  const title = s || '일정';
  return { kind:'event', date:ds, start, end, title, cat, people, notes };
}

/* ---------- Firebase 연결 ---------- */
const FBV = '11.0.2';
const EMAIL_DOMAIN = 'family-cal.app';
const WHO_EMAIL = k => `${k}@${EMAIL_DOMAIN}`;
let FB = null;
function mapCode(c){ c = String(c||''); return c.includes('permission') || c.includes('unauthenticated') ? 'unavailable' : c.includes('resource-exhausted') ? 'quota_exceeded' : c.includes('invalid-argument') ? 'transform_error' : 'unavailable'; }
function wrapDocSnap(x){ return { id:x.id, exists:x.exists(), data:() => x.data(), metadata:x.metadata }; }
function makeDb(F, fs){
  const docRef = path => { const ref = F.doc(fs, path); return {
    id:ref.id, path,
    get: async () => wrapDocSnap(await F.getDoc(ref)),
    set: d => F.setDoc(ref, d), update: d => F.updateDoc(ref, d), delete: () => F.deleteDoc(ref),
    onSnapshot: (next, err) => F.onSnapshot(ref, x => next(wrapDocSnap(x)), e => err && err({ code:mapCode(e.code), message:e.message })),
    collection: p => colRef(path + '/' + p)
  }; };
  const colRef = path => { const c = F.collection(fs, path); return {
    path,
    doc: id => docRef(id ? path + '/' + id : F.doc(c).path),
    add: async d => docRef((await F.addDoc(c, d)).path),
    get: async () => { const x = await F.getDocs(c); return { docs:x.docs.map(wrapDocSnap), size:x.size, empty:x.empty, metadata:x.metadata }; },
    onSnapshot: (next, err) => F.onSnapshot(c, x => next({ docs:x.docs.map(wrapDocSnap), size:x.size, empty:x.empty, metadata:x.metadata }), e => err && err({ code:mapCode(e.code), message:e.message }))
  }; };
  return { doc:docRef, collection:colRef };
}
async function fbConnect(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) { showLoginMsg('아직 사이트 준비가 끝나지 않았어요.', '저장 공간(Firebase) 연결 정보가 들어가면 바로 쓸 수 있어요.'); throw new Error('noconfig'); }
  const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [AP, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = AP.initializeApp(cfg);
  const auth = A.getAuth(app);
  let fs;
  try { fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch(e){ fs = F.getFirestore(app); }
  FB = { AP, A, F, app, auth, fs, cfg };
  let u = await new Promise(res => { const off = A.onAuthStateChanged(auth, x => { off(); res(x); }); });
  if (!u) u = await loginFlow();
  const who = (u.email || '').split('@')[0];
  if (!PERSONS.includes(who)) { await A.signOut(auth); throw new Error('unknown user'); }
  state.myWho = who; try { localStorage.setItem(WHOKEY, who); } catch(e){}
  state.members = { ...state.members, [u.uid]: who };
  const dbx = makeDb(F, fs);
  dbx.doc('members/' + u.uid).set({ who, at:Date.now() }).catch(() => {});
  A.onAuthStateChanged(auth, x => { if (!x) location.reload(); });
  return [dbx, { id: async () => u.uid, can: async () => true, profiles: async () => ({}) }];
}

async function importData(file){
  const F = FB.F, fs = FB.fs;
  const j = JSON.parse(await file.text());
  const writes = [];
  (j.events||[]).forEach(e => { const { id, ...d } = e; writes.push(['events/' + id, d]); });
  Object.entries(j.work||{}).forEach(([ds, w]) => writes.push(['work/' + ds, w]));
  (j.annivs||[]).forEach(a => { const { id, ...d } = a; writes.push(['annivs/' + id, d]); });
  (j.notices||[]).forEach(n => { const { id, ...d } = n; writes.push(['notices/' + id, d]); });
  if (j.config) writes.push(['config/main', j.config]);
  for (let i = 0; i < writes.length; i += 400) {
    const b = F.writeBatch(fs);
    writes.slice(i, i + 400).forEach(([p, d]) => b.set(F.doc(fs, p), d));
    await b.commit();
  }
  return writes.length;
}

async function boot(){
  render(); setSync('loading');
  try { [db, user] = await fbConnect(); } catch(e){ db = null; if (String(e && e.message) === 'noconfig') return; }
  if (!db) {
    local = true;
    const L = lload();
    state.events = L.events || []; state.work = L.work || {}; state.notices = L.notices || []; state.annivs = L.annivs || []; state.config = mergeConfig(L.config);
    state.loaded = true;
    setSync('local'); setTimeout(maybeAskWho, 300);
    showNote('⚠ 지금은 가족 달력에 연결되지 않아 이 휴대폰에만 저장돼요. 인터넷 연결을 확인하고 다시 열어 주세요.');
    render(); return;
  }
  try { me = user?.id ? await user.id() : null; } catch(e){ me = null; }
  try { const can = user?.can ? await user.can('data.write') : null; if (can === false) { state.readOnly = true; setSync('readonly'); showNote('보기 전용으로 열렸어요. 일정을 추가하려면 편집 권한이 필요해요.'); } } catch(e){}
  const timer = setTimeout(() => { if (!state.loaded) showNote('일정을 불러오는 중이에요. 연결이 느리면 잠시 후 다시 열어 주세요.'); }, 10000);
  let got = 0; const ready = (snap) => { if (!snap.metadata.fromCache) { got++; if (got >= 1) { state.loaded = true; clearTimeout(timer); if (!state.readOnly && !local) { hideNote(); setSync('shared'); checkLocalLeftovers(); } if (state.seenAt == null) initSeen(); setTimeout(maybeAskWho, 300);  } } };
  const onErr = e => { clearTimeout(timer); if (e.code !== 'revoked') showNote('일정을 불러오지 못했어요. 페이지를 다시 열어 주세요.'); };
  db.collection('events').onSnapshot(s => { state.events = s.docs.map(d => ({ id:d.id, ...d.data() })); ready(s); render(); }, onErr);
  db.collection('work').onSnapshot(s => { const w = {}; s.docs.forEach(d => { w[d.id] = d.data(); }); state.work = w; render(); }, onErr);
  db.collection('annivs').onSnapshot(s => { state.annivs = s.docs.map(d => ({ id:d.id, ...d.data() })); render(); }, onErr);
  db.collection('members').onSnapshot(s => { const m = {}; s.docs.forEach(d => { if (PERSONS.includes(d.data().who)) m[d.id] = d.data().who; }); state.members = m; if (state.loaded) maybeAskWho(); render(); }, onErr);
  db.collection('notices').onSnapshot(s => { state.notices = s.docs.map(d => ({ id:d.id, ...d.data() })); renderNotices(); }, onErr);
  db.doc('config/main').onSnapshot(s => { state.config = mergeConfig(s.exists ? s.data() : null); render(); renderPreview(); }, onErr);
}

function monthView(){

  let h = '<div class="mgrid">' + [...WD].map((w,i) => `<div class="dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');

function searchView(){
  const q = state.q.trim().toLowerCase();

    ((e.title||'').toLowerCase().includes(q) || (e.memo||'').toLowerCase().includes(q) || evLabel(e).includes(q)));
  const workHits = showWork() ? Object.entries(state.work).filter(([ds,w]) => workText(ds,w).toLowerCase().includes(q) || String(w.course).includes(q.replace(/\s|코스/g,''))) : [];
  const dates = [...new Set([...hits.map(e=>e.date), ...workHits.map(([d])=>d)])].sort();
  const td = ymd(today0());
  const up = dates.filter(d => d >= td), past = dates.filter(d => d < td).reverse();
  const block = list => list.map(ds => `<section class="dcard"><button class="dhead" data-goday="${ds}"><span class="d">${dLabel(ds)}</span></button><div class="items">${
      (workHits.find(([d])=>d===ds) ? (() => { const w = state.work[ds]; return `<button class="item work" data-work="${ds}"><span class="tm"></span><span class="it"><span class="nm">${esc(workText(ds,w))}</span></span></button>`; })() : '') +
      hits.filter(e=>e.date===ds).sort((a,b)=>(a.start||'').localeCompare(b.start||'')).map(e => `<button class="item" data-ev="${esc(e.id)}"><span class="tm">${e.start?fmtTime(e.start):'하루 종일'}</span><span class="it"><span class="tag" style="--c:${evColors(e)[0]}">${evDots(e)}${esc(evLabel(e))}</span><span class="nm">${esc(evTitle(e))}${isNew(e)?'<span class="newtag">NEW</span>':''}</span></span></button>`).join('')
    }</div></section>`).join('');
  if (!dates.length) return `<div class="empty">"${esc(state.q)}"에 맞는 일정이 없어요.</div>`;
  return `${up.length?`<div class="sec" style="margin-top:0">다가오는 일정 ${up.length}일</div><div class="days">${block(up)}</div>`:''}${past.length?`<div class="sec">지난 일정</div><div class="days">${block(past)}</div>`:''}`;
}

/* ---------- 빠른 입력 미리보기 ---------- */
function renderPreview(){
  const txt = $('#quick').value;
  const base = state.cursor;
  const prevCats = state.drafts.map(d => d._override);
  state.drafts = txt.split('\n').map(l => parseLine(l, base)).filter(Boolean);
  state.drafts.forEach((d,i) => {
    if (d.kind !== 'event') return;
    d._opts = [d.people.slice()].concat(CAT_KEYS.map(k => GROUP_OF[k] || [k])).filter((o,j,a) => a.findIndex(x => x.join() === o.join()) === j);
    d._i = 0;
    if (prevCats[i]) { d.people = prevCats[i].slice(); d._override = prevCats[i]; d._i = Math.max(0, d._opts.findIndex(o => o.join() === d.people.join())); }
  });
  $('#addBtn').disabled = !state.drafts.length;
  $('#preview').innerHTML = state.drafts.map((d,i) => {
    if (d.kind === 'anniv') { const a = d.a, o = a.month && a.day ? nextOcc(a) : null;
      return `<div class="pv"><span class="cbtn" style="--c:${annivColor(a)}">기념일</span><span class="pt">${annivIcon(a)}${esc(annivTitle(a))} · ${a.month&&a.day?esc(annivDateLabel(a)):'날짜 없음'}</span><span class="hint">${o ? `다음: ${fromYmd(o.date).getMonth()+1}/${fromYmd(o.date).getDate()}${annivCount(a,o.n)?' · '+annivCount(a,o.n):''}` : d.notes.join(' · ')}</span></div>`; }
    if (d.kind === 'notice') return `<div class="pv"><span class="cbtn" style="--c:var(--accent)">공지</span><span class="pt">${esc(d.text)}</span><span class="hint">${d.until ? dLabel(d.until)+'까지' : '기한 없음'}</span></div>`;
    if (d.kind === 'work') {
      const {row} = courseInfo(d.date, d.course);
      return `<div class="pv"><span class="pd">${dLabel(d.date)}</span><span class="cbtn" style="--c:${catVar('work')}">근무</span><span class="pt">${d.course==='휴무'?'휴무':`${TYPE_LABEL[dayType(d.date)]} ${esc(fmtCourse(d.course))} ${row?`${row.s}–${row.e}`:'(시간 미등록)'}`}</span></div>`;
    }
    return `<div class="pv"><span class="pd">${dLabel(d.date)}${d.start?' '+fmtTime(d.start):''}${d.end?'~'+fmtTime(d.end).replace(/오전 |오후 /,''):''}</span><button class="cbtn" data-cyc="${i}" style="--c:${evColors(d)[0]}" title="눌러서 대상 바꾸기">${esc(evLabel(d))}</button><span class="pt">${esc(d.title)}</span>${d.notes.length?`<span class="hint">${esc(d.notes.join(' · '))}</span>`:''}</div>`;
  }).join('');
}
async function addDrafts(){
  const ds = state.drafts.slice();
  if (!ds.length) return;
  $('#addBtn').disabled = true;
  try {
    for (const d of ds) {
      if (d.kind === 'anniv') { if (d.a.month && d.a.day) await api.addAnniv(d.a); continue; }
      if (d.kind === 'notice') { await api.addNotice({ text:d.text, until:d.until }); continue; }
      if (d.kind === 'work') await api.setWork(d.date, { course:d.course });
      else await api.addEvent({ date:d.date, start:d.start||'', end:d.end||'', title:d.title, cat:catFromPeople(d.people), people:d.people, memo:'' });
    }
    $('#quick').value = ''; state.drafts = []; renderPreview(); autosize();
    toast(ds.length > 1 ? `${ds.length}건 추가했어요` : ds[0].kind === 'notice' ? '공지를 올렸어요' : ds[0].kind === 'anniv' ? '기념일을 등록했어요' : `${dLabel(ds[0].date)}에 추가했어요`);
    if (ds.length === 1 && ds[0].date) { state.cursor = fromYmd(ds[0].date); render(); }
  } catch(e){ fail(e); $('#addBtn').disabled = false; }
}
function autosize(){ const t = $('#quick'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }

/* ---------- 시트 ---------- */
let sheetHashed = false;
function openSheet(html, bind){
  $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; $('#scrim').hidden = false; $('#sheet').scrollTop = 0;
  bind && bind($('#sheetBody'));
  if (!sheetHashed) { sheetHashed = true; try { location.hash = 'edit'; } catch(e){} }
}
function closeSheet(fromHash){
  $('#sheet').hidden = true; $('#scrim').hidden = true; $('#sheetBody').innerHTML = '';
  if (sheetHashed) { sheetHashed = false; if (fromHash !== true) { try { history.back(); } catch(e){} } }
}
function viewHash(){
  const c = state.cursor;
  return state.view === 'month' ? `month-${c.getFullYear()}-${pad(c.getMonth()+1)}` : `${state.view}-${ymd(c)}`;
}
function applyHash(h){
  const m = (h||'').match(/^(month|week|day|notice)-(\d{4})-(\d{2})(?:-(\d{2}))?$/);
  if (!m) return false;
  state.view = m[1]; state.cursor = new Date(+m[2], +m[3]-1, m[4] ? +m[4] : 1); return true;
}
const navStack = [];
function navTo(view, date){
  const before = viewHash();
  state.view = view; if (date) state.cursor = date;
  const h = viewHash();
  if (h !== before) { if (navStack[navStack.length-1] === h) navStack.pop(); else { navStack.push(before); if (navStack.length > 30) navStack.shift(); } }
  if (location.hash.slice(1) !== h) { try { location.hash = h; } catch(e){} }
  render(); renderPreview();
}
function goBack(){
  if (!$('#sheet').hidden) { closeSheet(); return; }
  const prev = navStack.pop();
  if (!prev || !applyHash(prev)) { state.view = 'month'; }
  try { history.replaceState(null, '', '#' + viewHash()); } catch(e){}
  render(); renderPreview();
}
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === 'edit') return;
  if (!$('#sheet').hidden) closeSheet(true);
  else sheetHashed = false;
  if (h === viewHash()) return;
  if (navStack[navStack.length-1] === h) navStack.pop();
  if (applyHash(h)) { render(); renderPreview(); }
});
function armDelete(btn, fn){

    fn();
  });
}

        const groups = [['오전', list.filter(r => /^오전/.test(r.c))], ['오후', list.filter(r => /^오후/.test(r.c))], ['', list.filter(r => !/^오[전후]/.test(r.c))]].filter(g => g[1].length);
        return groups.map(([g, rs]) => `${g ? `<div class="sec" style="margin:4px 0 0">${g}</div>` : ''}<div class="courses">${rs.map(btn).join('')}</div>`).join('') + `<div class="courses"><button class="course" data-c="휴무" aria-pressed="${cur==='휴무'}"><b>휴무</b><span>쉬는 날</span></button></div>`; })()
      : `<div class="note">${TYPE_LABEL[type]} 근무표가 아직 비어 있어요. 설정에서 근무표를 넣으면 코스를 눌러 고를 수 있어요. 지금은 코스 번호만 적어 둘 수 있어요.</div>
         <div class="row2"><div class="fld"><label for="w_c">코스</label><input id="w_c" value="${esc(cur||'')}" placeholder="예: 4"></div><div class="fld"><label>&nbsp;</label><button class="primary" id="w_save">저장</button></div></div>
         <button class="ghost" data-c="휴무">휴무로 표시</button>`}
    ${cur ? '<button class="danger" id="w_del" style="align-self:flex-start">삭제</button>' : ''}`,
  root => {
    root.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', async () => { try { await api.setWork(ds, { course:b.dataset.c }); closeSheet(); toast(`${dLabel(ds)} ${fmtCourse(b.dataset.c)}`); } catch(e){ fail(e); } }));
    const sv = root.querySelector('#w_save'); if (sv) sv.addEventListener('click', async () => { const v = root.querySelector('#w_c').value.replace(/코스/g,'').trim(); if (!v) return; try { await api.setWork(ds, { course:v }); closeSheet(); } catch(e){ fail(e); } });
    const dl = root.querySelector('#w_del'); if (dl) armDelete(dl, async () => { try { await api.delWork(ds); closeSheet(); } catch(e){ fail(e); } });
  });
}
function parseRoster(text){
  const out = [];
  text.split('\n').forEach(line => {
    const times = [...line.matchAll(/(\d{1,2})\s*[:.시]\s*(\d{2})|\b(\d{2})(\d{2})\b/g)];
    if (times.length < 2) return;
    const tt = mm => mm[1] != null ? `${pad(+mm[1])}:${mm[2]}` : `${mm[3]}:${mm[4]}`;
    const c = line.slice(0, times[0].index).replace(/코스|번|[:\-\s,|]/g,'').trim();
    if (!c) return;
    out.push({ c, s:tt(times[0]), e:tt(times[1]) });
  });
  return out;
}
function settings(){
  const cfg = clone(state.config); let tab = 'weekday';
  const rosterText = t => (cfg.roster[t]||[]).map(r => `${r.c} ${r.s} ${r.e}`).join('\n');
  const tableHtml = list => list.length ? `<div class="tablewrap"><table class="rtable"><thead><tr><th>코스</th><th>시작</th><th>종료</th><th>근무시간</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(fmtCourse(r.c))}</td><td>${r.s}</td><td>${r.e}</td><td>${dur(r.s,r.e)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty" style="padding:4px 0">한 줄에 "코스 시작 종료"로 적으면 아래에 표로 정리돼요.</div>';
  const extra = Object.entries(cfg.holidays||{}).map(([d,n]) => `${d} ${n}`).join('\n');
  openSheet(`
    <div class="sh"><h3>설정 · 근무표</h3><button class="ghost" data-close>닫기</button></div>
    <div class="row2"><div class="fld"><label for="s_me">내 이름</label><input id="s_me" value="${esc(cfg.names.me)}"></div><div class="fld"><label for="s_hus">남편 이름</label><input id="s_hus" value="${esc(cfg.names.hus)}"></div></div>
    <div class="row2"><div class="fld"><label for="s_k1">첫째 이름</label><input id="s_k1" value="${esc(cfg.names.kid1)}"></div><div class="fld"><label for="s_k2">둘째 이름</label><input id="s_k2" value="${esc(cfg.names.kid2)}"></div></div>
    <div class="fld"><label for="s_sur">성 (이름 앞에 붙여 써도 알아보게)</label><input id="s_sur" value="${esc(cfg.names.surname||'')}"></div>
    <div class="fld"><label>남편 근무표 (요일 종류별)</label>
      <div class="tabs3">${['weekday','saturday','holiday'].map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${TYPE_LABEL[t]}${t==='holiday'?'·일요일':''}</button>`).join('')}</div>
    </div>
    <div class="fld"><label for="s_roster" id="s_rlab">평일 근무표 붙여넣기</label><textarea id="s_roster" rows="6" placeholder="오전1 05:10 11:40&#10;오전2 05:40 12:20&#10;오후1 12:40 00:10">${esc(rosterText(tab))}</textarea></div>
    <div id="s_table">${tableHtml(cfg.roster[tab]||[])}</div>
    <div class="fld"><label for="s_hol">추가 공휴일 · 회사 지정 휴일 (공휴일 근무표 적용)</label><textarea id="s_hol" rows="3" placeholder="2026-12-31 회사 휴무">${esc(extra)}</textarea></div>
    <div class="help">일요일과 공휴일은 '공휴일' 근무표를 써요. 2026–2027년 법정공휴일은 이미 들어 있어요.</div>
    <div class="btns"><button class="primary" id="s_save">저장</button></div>`,
  root => {
    const ta = root.querySelector('#s_roster');
    const sync = () => { cfg.roster[tab] = parseRoster(ta.value); root.querySelector('#s_table').innerHTML = tableHtml(cfg.roster[tab]); };
    ta.addEventListener('input', sync);
    root.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      sync(); tab = b.dataset.tab;
      root.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-pressed', x===b));
      root.querySelector('#s_rlab').textContent = `${TYPE_LABEL[tab]} 근무표 붙여넣기`;
      ta.value = rosterText(tab); root.querySelector('#s_table').innerHTML = tableHtml(cfg.roster[tab]||[]);
    }));
    root.querySelector('#s_save').addEventListener('click', async () => {
      sync();
      cfg.names.me = root.querySelector('#s_me').value.trim() || '나';
      cfg.names.hus = root.querySelector('#s_hus').value.trim() || '남편';
      cfg.names.kid1 = root.querySelector('#s_k1').value.trim() || '첫째';
      cfg.names.kid2 = root.querySelector('#s_k2').value.trim() || '둘째';
      cfg.names.surname = root.querySelector('#s_sur').value.trim();
      const hol = {}; root.querySelector('#s_hol').value.split('\n').forEach(l => { const m = l.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\s*(.*)/); if (m) hol[`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`] = m[4].trim() || '휴일'; });
      cfg.holidays = hol;
      try { await api.setConfig(cfg); closeSheet(); toast('설정을 저장했어요'); } catch(e){ fail(e); }
    });
    if (state.readOnly) root.querySelector('#s_save').disabled = true;
  });
}

/* ---------- 기타 ---------- */
function showNote(t){ const n = $('#note'); n.textContent = t; n.hidden = false; }
function hideNote(){ $('#note').hidden = true; }
let toastT; function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

function closePop(){ $('#pop').hidden = true; }
function togglePop(btn){
  const pop = $('#pop');
  if (!pop.hidden) { closePop(); return; }
  pop.innerHTML = PEOPLE.map(k => `<button data-pf="${k}" role="menuitem" aria-pressed="${state.filter===k}"><span class="dot" style="--c:${catVar(k)}"></span>${esc(catLabel(k))}</button>`).join('');
  pop.hidden = false;
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth, vw = document.documentElement.clientWidth;
  pop.style.top = (r.bottom + 6) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, vw - w - 8)) + 'px';
}
window.addEventListener('scroll', closePop, { passive:true });
window.addEventListener('resize', closePop);
document.addEventListener('click', ev => {
  if (!ev.target.closest('#pop') && !ev.target.closest('[data-people]')) closePop();
  const t = ev.target.closest('button'); if (!t) { if (ev.target.id === 'scrim') closeSheet(); return; }
  if (t.dataset.view) { navTo(t.dataset.view); return; }
  if (t.hasAttribute('data-back')) { goBack(); return; }
  if (t.dataset.addev) { editEvent(null, t.dataset.addev); return; }
  if (t.dataset.kwork) { editWork(t.dataset.kwork); return; }
  if (t.dataset.kanniv) { const d0 = fromYmd(t.dataset.kanniv); editAnniv(null, { kind:'birthday', who:state.myWho || 'me', whoText:'', title:'', lunar:false, month:d0.getMonth()+1, day:d0.getDate(), year:'' }); return; }
  if (t.dataset.f) { state.filter = t.dataset.f; render(); return; }
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.dataset.day) {
    if (state.workMode) { editWork(t.dataset.day); return; }
    navTo('day', fromYmd(t.dataset.day)); return;
  }
  if (t.dataset.goday) { state.q = ''; navTo('day', fromYmd(t.dataset.goday)); return; }
  if (t.dataset.goday) { state.cursor = fromYmd(t.dataset.goday); state.view = 'day'; state.q = ''; render(); renderPreview(); return; }
  if (t.hasAttribute('data-addnotice')) { editNotice(null); return; }
  if (t.dataset.notice) { editNotice(t.dataset.notice); return; }
  if (t.hasAttribute('data-whoami')) { if (FB) accountSheet(); else whoPicker(false); return; }
  if (t.dataset.setwho) { setWho(t.dataset.setwho); return; }
  if (t.hasAttribute('data-bell')) { bellSheet(); return; }
  if (t.hasAttribute('data-seenall')) { markSeen(); return; }
  if (t.hasAttribute('data-sync')) { syncHelp(); return; }
  if (t.hasAttribute('data-migrate')) { migrateLocal(); return; }
  if (t.hasAttribute('data-noticelist')) { navTo('notice'); return; }
  if (t.hasAttribute('data-annivlist')) { annivList(); return; }
  if (t.hasAttribute('data-addanniv')) { editAnniv(null); return; }
  if (t.dataset.anniv) { editAnniv(t.dataset.anniv); return; }
  if (t.hasAttribute('data-people')) { togglePop(t); return; }
  if (t.dataset.pf) { state.filter = t.dataset.pf; closePop(); render(); return; }
  if (t.dataset.ev) { editEvent(t.dataset.ev); return; }
  if (t.dataset.work) { editWork(t.dataset.work); return; }
  if (t.dataset.cyc != null) {
    const d = state.drafts[+t.dataset.cyc];
    d._i = (d._i + 1) % d._opts.length; d.people = d._opts[d._i].slice(); d.cat = catFromPeople(d.people); d._override = d.people;
    t.style.setProperty('--c', evColors(d)[0]); t.textContent = evLabel(d); return;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
const step = dir => {
  if (state.view === 'notice') return;
  const c = state.cursor;
  state.cursor = state.view === 'month' ? new Date(c.getFullYear(), c.getMonth()+dir, 1) : addDays(c, state.view==='week' ? 7*dir : dir);
  render(); renderPreview();
};
$('#prev').addEventListener('click', () => step(-1));
/* 스와이프: 좌우 = 이전·다음 기간, 위아래 = 월·주·일·공지 */
const VIEWS = ['month','week','day','notice'];
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
function slide(cls){ if (reduceMotion) return; const v = $('#view'); v.classList.remove('swl','swr','swu','swd'); void v.offsetWidth; v.classList.add(cls); }
let tStart = null;
const mainEl = document.querySelector('main');
mainEl.addEventListener('touchstart', e => {
  tStart = null;
  if (e.touches.length !== 1 || !$('#sheet').hidden) return;
  if (e.target.closest('input,textarea,select,.tablewrap')) return;
  const t = e.touches[0], de = document.documentElement;
  tStart = { x:t.clientX, y:t.clientY, at:Date.now(), top: window.scrollY <= 2, bottom: window.innerHeight + window.scrollY >= de.scrollHeight - 2 };
}, { passive:true });
mainEl.addEventListener('touchend', e => {
  if (!tStart) return;
  const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y, dt = Date.now() - tStart.at, st = tStart;
  tStart = null;
  if (dt > 700) return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (state.view === 'notice' || state.q.trim()) return;
    step(dx < 0 ? 1 : -1); slide(dx < 0 ? 'swl' : 'swr');
  } else if (Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.5 && !state.q.trim()) {
    const i = VIEWS.indexOf(state.view) + (dy < 0 ? 1 : -1);
    if (i < 0 || i >= VIEWS.length) return;
    if ((dy < 0 && !st.bottom) || (dy > 0 && !st.top)) return;
    navTo(VIEWS[i]); slide(dy < 0 ? 'swu' : 'swd');
  }
}, { passive:true });
$('#next').addEventListener('click', () => step(1));
$('#today').addEventListener('click', () => { state.cursor = today0(); render(); renderPreview(); });
$('#workMode').addEventListener('click', () => { state.workMode = !state.workMode; if (state.workMode) state.view = 'month'; render(); toast(state.workMode ? '근무 입력 모드 켜짐' : '근무 입력 모드 꺼짐'); });
$('#openSettings').addEventListener('click', settings);
$('#quick').addEventListener('input', () => { renderPreview(); autosize(); });
$('#quick').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addDrafts(); } });
$('#addBtn').addEventListener('click', addDrafts);

// 뷰 상태 기억 (이 기기)
state.view = 'month'; state.cursor = today0();
const _render = render;
render = function(){ _render(); try { localStorage.setItem('dasom-cal-view', state.view); } catch(e){}
  if (!sheetHashed && location.hash.slice(1) !== viewHash()) { try { history.replaceState(null, '', '#' + viewHash()); } catch(e){} } };
try { history.replaceState(null, '', '#' + viewHash()); } catch(e){}

boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
</script>
