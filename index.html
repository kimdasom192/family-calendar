<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 가족달력</title>
<meta name="theme-color" content="#3E7A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky header (month + view tabs + filter chips) → view body → fixed quick-input dock at the bottom; sheets slide up for edits. */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --surface2:#EAF0E7; --ink:#1D2A21; --muted:#66756A; --line:#D9E2D5;
  --accent:#3E7A4D; --accent-ink:#FFFFFF; --sun:#C8443E; --sat:#3568B0;
  --c-me:#D25C74; --c-hus:#3474BE; --c-couple:#8259C4; --c-kid1:#1B9AA8; --c-kid2:#E0742A; --c-kids:#C99A12; --c-family:#2C9466; --c-work:#2E3C55; --c-elder:#9A6247; --warn:#B9770A;
  --tint:12%;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1A221D; --surface2:#222C25; --ink:#E6EDE6; --muted:#97A69A; --line:#2E3A31;
  --accent:#7DBE8B; --accent-ink:#0F1A12; --sun:#F07C74; --sat:#7EA8EA;
  --c-me:#F08AA0; --c-hus:#6FA5E8; --c-couple:#B092F0; --c-kid1:#55CBD6; --c-kid2:#F59A5E; --c-kids:#E8C34E; --c-family:#5FC896; --c-work:#9FB0CF; --c-elder:#D9A486; --warn:#F0B44E;
  --tint:22%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1A221D; --surface2:#222C25; --ink:#E6EDE6; --muted:#97A69A; --line:#2E3A31;
  --accent:#7DBE8B; --accent-ink:#0F1A12; --sun:#F07C74; --sat:#7EA8EA;
  --c-me:#F08AA0; --c-hus:#6FA5E8; --c-couple:#B092F0; --c-kid1:#55CBD6; --c-kid2:#F59A5E; --c-kids:#E8C34E; --c-family:#5FC896; --c-work:#9FB0CF; --c-elder:#D9A486; --warn:#F0B44E;
  --tint:22%; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior-y:contain}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding-block:12px 8px}
.brand{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bell{flex:none;border:0;border-radius:999px;padding:1px 9px;background:var(--sun);color:var(--surface);font-weight:700;font-size:11px;letter-spacing:0;display:inline-flex;align-items:center;gap:3px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;color:#fff}
.b-new{background:var(--accent)}.b-edit{background:var(--sat)}.b-del{background:var(--sun)}
.chg{display:block;margin-top:3px;font-size:12px;color:var(--muted);line-height:1.45}
.nitem[disabled]{cursor:default;opacity:1}
.news .nitem .nt{display:block;-webkit-line-clamp:unset;overflow:visible}
.b-warn{background:var(--warn)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.mstats div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mstats span{font-size:12px;color:var(--muted)}
.mstats b{font-size:clamp(13px,3.7vw,16px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{color:var(--sun)} .in{color:var(--accent)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.bar .top span:first-child{font-weight:600}
.bar .trk{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar .fill{height:100%;border-radius:99px;background:var(--accent)}
.bar.warn .fill{background:var(--warn)} .bar.over .fill{background:var(--sun)}
.bar .pct{font-weight:700} .bar.warn .pct,.bar.warn .warnline{color:var(--warn)} .bar.over .pct,.bar.over .warnline{color:var(--sun)}
.warnline{font-size:12px;font-weight:600;margin-top:4px}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.items .mrow:first-child{border-top:0}
.mrow .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .mm{min-width:0;display:flex;flex-direction:column;gap:3px}
.mrow .mm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tags{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mrow.cx .amt,.mrow.cx b{text-decoration:line-through;color:var(--muted)}
.chipx{border:1px solid var(--line);border-radius:999px;padding:0 6px}
.mtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
.mtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bookbar{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--surface)}
.bookbar button{border:0;background:none;padding:10px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.bookbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dcard.today{margin-bottom:12px}
.mstats .tap{cursor:pointer}
.mstats .tap:hover{background:var(--surface2)}
.warnx{color:var(--danger, #c0392b);font-weight:600}
:root{--cyc:#e0607e}
.cy{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.cy.on{background:var(--cyc)}
.cy.pred{border:1.5px solid var(--cyc);width:6px;height:6px}
.cy.fertile{background:#7cc58f;width:5px;height:5px;opacity:.8}
.cyx{font-size:10px;line-height:1.25;padding:1px 4px;border-radius:5px;background:color-mix(in srgb, #6b8fb3 18%, transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cycard{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid color-mix(in srgb, var(--cyc) 35%, var(--line));background:color-mix(in srgb, var(--cyc) 7%, var(--surface));border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.cycard.share{border-color:var(--line);background:color-mix(in srgb, #6b8fb3 10%, var(--surface))}
.cycard .grow{flex:1;min-width:150px}
.cybtns{display:flex;gap:6px;flex-wrap:wrap}
.cybtns .ghost{height:32px;padding:0 10px;font-size:13px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.tgl{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:14px}
.tgl+.tgl{border-top:1px solid var(--line)}
.bookhelp{margin:-2px 0 10px}
.mstats.inst3{grid-template-columns:1.12fr 1.12fr .76fr}
.mstats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:640px){.mstats.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mstats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.mstats.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.save{color:var(--sat)} .amt.out{color:var(--sun)} .amt.in{color:var(--accent)} .amt.save{color:var(--sat)}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.gcard{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.chipx.inst{border-color:var(--sat);color:var(--sat)} .chipx.ok{border-color:var(--accent);color:var(--accent)} .chipx.bad{border-color:var(--sun);color:var(--sun)}
.bar.ok .fill{background:var(--sat)}
button.bar{display:block;width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.bar.tap{cursor:pointer;border-radius:8px}
.bar.tap:hover{background:var(--surface2)}
.go{color:var(--muted);font-weight:400}
.newtag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--surface);background:var(--sun);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.ev.isnew{outline:1.5px solid var(--sun);outline-offset:-1px}
.sync{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;letter-spacing:0;background:var(--surface2);color:var(--muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sync.who{color:var(--ink);background:var(--surface2)}
.sync.who::before{display:none}
.whopick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whopick button{border:2px solid var(--c);color:var(--c);background:none;border-radius:12px;padding:14px;font-size:17px;font-weight:600}
.whopick button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.sync.bad{color:var(--surface);background:var(--sun)}
.sync.bad::before{background:var(--surface)}
.title{font-family:var(--f-display);font-size:clamp(20px,6vw,24px);line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{background:var(--c-work);color:var(--surface);border-color:var(--c-work)}
.trow{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.nav{display:flex;gap:4px;margin-left:auto;flex:none}
.ntick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:32px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:999px;padding:0 12px;text-align:left}
.ntick .lbl{flex:none;font-size:12px;font-weight:600;color:var(--accent)}
.ntick .txt{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntick .txt.muted{color:var(--muted)}
.ntick:empty{visibility:hidden}
.caret{font-size:10px;opacity:.7}
.pop{position:fixed;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.16);padding:6px;max-height:240px;overflow-y:auto;min-width:180px;display:flex;flex-direction:column;gap:2px}
.pop button{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;font-size:14px}
.pop button[aria-pressed="true"]{background:var(--surface2);font-weight:600}
.pop button:hover{background:var(--surface2)}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;min-width:32px;padding:0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.search{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 10px;width:120px}
.search input{border:0;background:none;outline:0;width:100%;padding:4px 0;font-size:13px}

/* banner */
.note{margin-top:10px;padding:8px 12px;border-radius:var(--r);background:var(--surface2);color:var(--muted);font-size:13px}
.note[hidden]{display:none}

main{padding-block:12px 220px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--surface2);text-align:center;font-size:11px;font-weight:600;padding:5px 0;color:var(--muted)}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{background:var(--surface);min-height:84px;padding:4px 3px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left;align-items:stretch}
.cell.out{background:var(--bg)} .cell.out .dn{opacity:.4}
.dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;min-width:0}
.dn.sun{color:var(--sun)} .dn.sat{color:var(--sat)}
.cell.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.hname{font-size:9px;font-weight:500;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{font-size:10px;letter-spacing:-.02em;font-weight:600;color:var(--surface);background:var(--c-work);border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wk.off{background:none;color:var(--c-work);border:1px dashed var(--c-work)}
.ev.multi{box-shadow:inset 2px 0 0 var(--c2);background:linear-gradient(90deg,color-mix(in srgb,var(--c) var(--tint),transparent),color-mix(in srgb,var(--c2) var(--tint),transparent))}
.tag .dot+.dot{margin-left:-3px}
.ev{font-size:10px;line-height:1.35;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) var(--tint),transparent);border-left:2px solid var(--c)}
.more{font-size:10px;color:var(--muted);padding-left:3px}
.cell.pick{outline:2px solid var(--c-work);outline-offset:-2px}

/* lists (week, day, search) */
.days{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dhead{display:flex;align-items:baseline;gap:8px;padding:8px 12px;background:var(--surface2);border:0;width:100%;text-align:left}
.dhead .d{font-weight:600;font-variant-numeric:tabular-nums}
.dhead .t{font-size:12px;color:var(--muted)}
.dhead.today{background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;align-items:start}
.items .item:first-child{border-top:0}
.tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.it{min-width:0;display:flex;flex-direction:column;gap:2px}
.it .nm{font-weight:500;overflow-wrap:anywhere}
.it .memo{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--c);font-weight:600}
.item.work{background:color-mix(in srgb,var(--c-work) 9%,transparent)}
.empty{padding:12px;color:var(--muted);font-size:13px}
.notices{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.nhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.nhead .lbl{font-weight:600;color:var(--accent);letter-spacing:.04em}
.nhead .cnt{font-size:12px;color:var(--muted)}
.nhead .add{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 4px}
.nitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px}
.nitem:first-child{border-top:0}
.nitem .nt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nitem .nd{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.nitem .nd.soon{color:var(--sun);font-weight:600}
.av{font-size:10px;font-weight:600;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.item.anniv{background:color-mix(in srgb,var(--c) 8%,transparent)}
.abar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.alist .nitem .nt{-webkit-line-clamp:1}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.emo-row{display:flex;align-items:center;gap:10px}
.emo-cur{width:44px;height:44px;border-radius:12px;border:1px dashed var(--line);background:var(--bg);font-size:22px;color:var(--muted)}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;background:var(--bg);border-radius:12px;padding:8px;max-height:200px;overflow-y:auto}
.emo-grid button{height:40px;border:0;border-radius:8px;background:none;font-size:20px}
.emo-grid button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.emo-grid button.none{font-size:11px;color:var(--muted)}
.hback{flex:none;width:38px;height:38px;border:0;background:var(--ink);color:var(--bg);border-radius:50%;font-weight:700;font-size:20px;line-height:1;display:grid;place-items:center;padding:0 2px 2px 0}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;margin-bottom:10px}
.addday{width:100%;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--accent);border-radius:var(--r);padding:11px;font-weight:600;margin-top:10px}
.kindtabs{display:flex;gap:6px;flex-wrap:wrap}
.kindtabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.kindtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

(() => {
const $ = s => document.querySelector(s);

/* ---------- 공휴일 (설정에서 추가 가능) ---------- */

/* 가계부 두 권: fam = 가족 공유, mine = 나만 보는 가계부 (private/<uid>/...) */

state.book = 'fam';
['ledger','budget','fixed','catmap'].forEach(k => Object.defineProperty(state, k, { get(){ return books[state.book][k]; }, set(v){ books[state.book][k] = v; }, configurable:true }));
function inBook(bk, fn){ const prev = state.book; state.book = bk; try { return fn(); } finally { state.book = prev; } }
function bp(path, bk){ return (bk || state.book) === 'mine' && me ? `private/${me}/${path}` : path; }
const BOOKCARDS = { fam:['삼성카드','하나카드','롯데카드','하나은행','현금','기타'], mine:['삼성카드','카카오페이','카카오뱅크','기업은행','신한은행','농협','현금','기타'] };

function hasMine(){ return !!db && !local && !!me && (state.myWho === 'me' || books.mine.ledger.length > 0); }
const BOOKKEY = 'fc_book';

const CAT_KEYS = ['me','hus','couple','kid1','kid2','kids','family'];
const PEOPLE = ['me','hus','couple','kid1','kid2','kids'];
const PERSONS = ['me','hus','kid1','kid2'];

function peopleOf(e){ if (Array.isArray(e.people) && e.people.length) return e.people; return GROUP_OF[e.cat] || [e.cat || 'me']; }
function catFromPeople(ps){
  const set = PERSONS.filter(p => ps.includes(p));
  if (!set.length) return 'me';

function evColors(e){ const c = evCat(e); if (c !== 'multi') return [catVar(c)]; return peopleOf(e).filter(p => PERSONS.includes(p)).map(catVar); }

/* ---------- Firebase 연결 ---------- */
const FBV = '11.0.2';
const EMAIL_DOMAIN = 'family-cal.app';
const WHO_EMAIL = k => `${k}@${EMAIL_DOMAIN}`;
let FB = null;
function mapCode(c){ c = String(c||''); return c.includes('permission') || c.includes('unauthenticated') ? 'unavailable' : c.includes('resource-exhausted') ? 'quota_exceeded' : c.includes('invalid-argument') ? 'transform_error' : 'unavailable'; }
function wrapDocSnap(x){ return { id:x.id, exists:x.exists(), data:() => x.data(), metadata:x.metadata }; }
function makeDb(F, fs){
  const docRef = path => { const ref = F.doc(fs, path); return {
    id:ref.id, path,
    get: async () => wrapDocSnap(await F.getDoc(ref)),
    set: (d, o) => o ? F.setDoc(ref, d, o) : F.setDoc(ref, d), update: d => F.updateDoc(ref, d), delete: () => F.deleteDoc(ref),
    onSnapshot: (next, err) => F.onSnapshot(ref, { includeMetadataChanges:true }, x => next(wrapDocSnap(x)), e => err && err({ code:mapCode(e.code), message:e.message })),
    collection: p => colRef(path + '/' + p)
  }; };
  const colRef = path => { const c = F.collection(fs, path); return {
    path,
    doc: id => docRef(id ? path + '/' + id : F.doc(c).path),
    add: async d => docRef((await F.addDoc(c, d)).path),
    get: async () => { const x = await F.getDocs(c); return { docs:x.docs.map(wrapDocSnap), size:x.size, empty:x.empty, metadata:x.metadata }; },
    onSnapshot: (next, err) => F.onSnapshot(c, { includeMetadataChanges:true }, x => next({ docs:x.docs.map(wrapDocSnap), size:x.size, empty:x.empty, metadata:x.metadata }), e => err && err({ code:mapCode(e.code), message:e.message }))
  }; };
  return { doc:docRef, collection:colRef };
}
async function fbConnect(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey) { showLoginMsg('아직 사이트 준비가 끝나지 않았어요.', '저장 공간(Firebase) 연결 정보가 들어가면 바로 쓸 수 있어요.'); throw new Error('noconfig'); }
  const base = `https://www.gstatic.com/firebasejs/${FBV}/`;
  connStage = '프로그램 불러오기';
  let AP, A, F;
  try { [AP, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch(e){ lastErr = '프로그램을 불러오지 못함'; throw e; }
  connStage = '로그인 확인';
  const app = AP.initializeApp(cfg);
  const auth = A.getAuth(app);
  let fs;
  const slowNet = (() => { try { return localStorage.getItem('fc-longpoll') === '1'; } catch(e){ return false; } })();
  const opts = { experimentalForceLongPolling: true };
  try { fs = F.initializeFirestore(app, { ...opts, localCache: slowNet ? F.memoryLocalCache() : F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch(e){ try { fs = F.initializeFirestore(app, opts); } catch(e2){ fs = F.getFirestore(app); } }
  FB = { AP, A, F, app, auth, fs, cfg };
  let u = await new Promise(res => { const off = A.onAuthStateChanged(auth, x => { off(); res(x); }); });
  if (!u) u = await loginFlow();
  const who = (u.email || '').split('@')[0];
  if (!PERSONS.includes(who)) { await A.signOut(auth); throw new Error('unknown user'); }
  state.myWho = who; try { localStorage.setItem(WHOKEY, who); } catch(e){}
  state.members = { ...state.members, [u.uid]: who };
  connStage = '일정 불러오기';
  const dbx = makeDb(F, fs);
  dbx.doc('members/' + u.uid).set({ who, at:Date.now() }).catch(() => {});
  A.onAuthStateChanged(auth, x => { if (!x) location.reload(); });
  return [dbx, { id: async () => u.uid, can: async () => true, profiles: async () => ({}) }];
}
function loginEl(){ const el = $('#login'); el.hidden = false; return el; }
function showLoginMsg(title, body){ loginEl().innerHTML = `<div class="box"><h1>${esc(title)}</h1><p>${esc(body)}</p></div>`; }
function loginFlow(){
  return new Promise(resolve => {
    const draw = () => {
      loginEl().innerHTML = `<div class="box">
        <div class="brand">가족달력</div>
        <h1>코드를 입력해 주세요</h1>
        <p>가족마다 받은 6자리 코드로 들어와요. 한 번 들어오면 이 휴대폰은 계속 기억해요.</p>

        <div class="err" id="lg_err"></div>
        <button class="primary" id="lg_go" style="height:50px;font-size:16px">들어가기</button>

      const inp = $('#lg_code'), err = $('#lg_err'), go = $('#lg_go');

        go.disabled = true; err.textContent = '확인 중…';
        for (const k of PERSONS) {
          try { const c = await FB.A.signInWithEmailAndPassword(FB.auth, WHO_EMAIL(k), code); $('#login').hidden = true; resolve(c.user); return; }
          catch(e){ if (String(e.code).includes('too-many-requests')) { err.textContent = '여러 번 틀려서 잠시 막혔어요. 몇 분 뒤에 다시 해 주세요.'; go.disabled = false; return; }
            if (String(e.code).includes('network')) { err.textContent = '인터넷 연결을 확인해 주세요.'; go.disabled = false; return; } }
        }
        err.textContent = '코드가 맞지 않아요. 다시 확인해 주세요.'; go.disabled = false;
      };
      go.addEventListener('click', tryLogin);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
      $('#lg_setup').addEventListener('click', drawSetup);
    };
    const rnd = () => String(Math.floor(100000 + Math.random() * 900000));
    const drawSetup = () => {
      const labels = { me:'나 (엄마)', hus:'남편 (아빠)', kid1:'첫째', kid2:'둘째' };
      loginEl().innerHTML = `<div class="box">
        <h1>처음 설정</h1>
        <p>가족 네 명의 코드를 정해요. 처음 한 번만 하면 되고, 코드는 나중에 각자 바꿀 수 있어요. 아이들이 쓰지 않아도 네 명 모두 만들어 두세요.</p>
        ${PERSONS.map(k => `<div class="setrow"><label for="su_${k}">${labels[k]}</label><input id="su_${k}" inputmode="numeric" maxlength="12" value="${rnd()}"></div>`).join('')}
        <div class="err" id="su_err"></div>
        <button class="primary" id="su_go" style="height:50px;font-size:16px">코드 만들기</button>
        <button class="linkbtn" id="su_back">‹ 코드 입력으로 돌아가기</button>
      </div>`;
      $('#su_back').addEventListener('click', draw);
      $('#su_go').addEventListener('click', async () => {
        const err = $('#su_err'), btn = $('#su_go');
        const codes = Object.fromEntries(PERSONS.map(k => [k, $('#su_' + k).value.replace(/\s/g,'')]));
        if (Object.values(codes).some(c => c.length < 6)) { err.textContent = '코드는 6자리 이상이어야 해요.'; return; }
        if (new Set(Object.values(codes)).size !== 4) { err.textContent = '네 사람의 코드가 모두 달라야 해요.'; return; }
        btn.disabled = true; err.textContent = '만드는 중…';
        let done = 0;
        for (const k of PERSONS) {
          try { await FB.A.createUserWithEmailAndPassword(FB.auth, WHO_EMAIL(k), codes[k]); done++; }
          catch(e){ if (String(e.code).includes('email-already-in-use')) continue; err.textContent = '만들지 못했어요: ' + (e.code || e.message); btn.disabled = false; return; }
        }
        if (!done) { err.textContent = '이미 설정이 끝났어요. 받은 코드로 들어와 주세요.'; btn.disabled = false; return; }

        loginEl().innerHTML = `<div class="box"><h1>코드가 만들어졌어요</h1><p>아래 코드를 가족에게 알려 주세요. 이 화면을 캡처해 두면 좋아요.</p>
          <div class="codes">${PERSONS.map(k => `<div><span>${labels[k]}</span><b>${codes[k]}</b></div>`).join('')}</div>
          <button class="primary" id="su_done" style="height:50px;font-size:16px">달력 열기</button></div>`;
        $('#su_done').addEventListener('click', () => { if (c) { $('#login').hidden = true; resolve(c.user); } else draw(); });
      });
    };
    draw();
  });

async function importData(file){

  if (Array.isArray(j.fixed) && j.fixed.length) { const nw = new Set(j.fixed.map(f => f.id)); writes.push([bp('config/fixed', bk), { items:(bb.fixed || []).filter(f => !nw.has(f.id)).concat(j.fixed), at:Date.now() }]); }

    // 알림으로 이미 들어온 같은 내역(같은 날·통장·금액)은 건너뛰기
    if (dedupe && (bb.ledger || []).some(e => e.id !== id && !e.cancelled && e.card === d.card && e.type === d.type && +e.amount === +d.amount && e.date === d.date)) return; writes.push([bp('ledger/' + (id || ('imp' + Math.random().toString(36).slice(2, 12))), bk), { src:'import', cancelled:false, review:false, at:Date.now(), ...d }]); });
  if (j.pay && typeof j.pay === 'object') { const cur = bb.budget || {}; writes.push([bp('config/budget', bk), { cards:cur.cards || {}, cats:cur.cats || {}, saves:cur.saves || [], pay:{ ...(cur.pay || {}), ...j.pay }, at:Date.now() }]); }
  if (j.balances && typeof j.balances === 'object') writes.push([bp('config/balances', bk), { ...(bb.balances || {}), ...j.balances }]);
  if (Array.isArray(j.cycle) && j.cycle.length) { if (!me) throw new Error('로그인한 뒤 가져와 주세요'); const have = new Set(cyc.periods.map(p => p.start)); const add = j.cycle.filter(p => p.start && !have.has(p.start)).map((p, i) => ({ id:'c' + Date.now().toString(36) + i, end:'', flow:'', sym:[], memo:'', ...p })); writes.push([bp('config/cycle', 'mine'), { periods:cyc.periods.concat(add), settings:cyc.settings, at:Date.now() }]); }
  if (j.config) writes.push(['config/main', j.config]);

  }
  return writes.length;
}

function searchView(){

  const dates = [...new Set([...hits.map(e=>e.date), ...workHits.map(([d])=>d)])].sort();

async function addDrafts(){

  try {
    for (const d of ds) {
      if (d.kind === 'anniv') { if (d.a.month && d.a.day) await api.addAnniv(d.a); continue; }
      if (d.kind === 'money') { if (d.amount) await api.addMoney({ type:d.type, amount:d.amount, inst:d.inst || 0, goal:d.goal || '', merchant:d.merchant, card:d.card, cat:d.cat, date:d.date, time:'', who:state.myWho || 'me', memo:'', cancelled:false, review:false, src:'manual' }); continue; }
      if (d.kind === 'notice') { await api.addNotice({ text:d.text, until:d.until }); continue; }
      if (d.kind === 'cycle') { if (cycOwner()) { if (d.act === 'end') await cycEnd(d.date); else await cycStart(d.date); } continue; }
      if (d.kind === 'work') await api.setWork(d.date, { course:d.course });

function closeSheet(fromHash){

function viewHash(){
  const c = state.cursor;
  return state.view === 'month' ? `month-${c.getFullYear()}-${pad(c.getMonth()+1)}` : `${state.view}-${ymd(c)}`;
}
function applyHash(h){
  const m = (h||'').match(/^(month|week|day|notice|money)-(\d{4})-(\d{2})(?:-(\d{2}))?$/);
  if (!m) return false;
  state.view = m[1]; state.cursor = new Date(+m[2], +m[3]-1, m[4] ? +m[4] : 1); return true;
}
const navStack = [];
function navTo(view, date){
  const before = viewHash();
  state.view = view; if (date) state.cursor = date;
  const h = viewHash();
  if (h !== before) { if (navStack[navStack.length-1] === h) navStack.pop(); else { navStack.push(before); if (navStack.length > 30) navStack.shift(); } }
  if (location.hash.slice(1) !== h) { try { location.hash = h; } catch(e){} }
  render(); renderPreview();
}
function goBack(){
  if (!$('#sheet').hidden) { closeSheet(); return; }
  const prev = navStack.pop();
  if (!prev || !applyHash(prev)) { state.view = 'month'; }
  try { history.replaceState(null, '', '#' + viewHash()); } catch(e){}
  render(); renderPreview();
}
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === 'edit') return;
  if (h === 'news') { try { history.replaceState(null, '', '#' + viewHash()); } catch(e){} bellSheet(); return; }
  if (!$('#sheet').hidden) closeSheet(true);
  else sheetHashed = false;
  if (h === viewHash()) return;
  if (navStack[navStack.length-1] === h) navStack.pop();
  if (applyHash(h)) { render(); renderPreview(); }
});

function parseRoster(text){
  const out = [];
  text.split('\n').forEach(line => {
    const times = [...line.matchAll(/(\d{1,2})\s*[:.시]\s*(\d{2})|\b(\d{2})(\d{2})\b/g)];
    if (times.length < 2) return;
    const tt = mm => mm[1] != null ? `${pad(+mm[1])}:${mm[2]}` : `${mm[3]}:${mm[4]}`;
    const c = line.slice(0, times[0].index).replace(/코스|번|[:\-\s,|]/g,'').trim();
    if (!c) return;
    out.push({ c, s:tt(times[0]), e:tt(times[1]) });
  });
  return out;
}

  if (t.hasAttribute('data-addmoney')) { editMoney(null); return; }
  if (t.hasAttribute('data-budget')) { budgetSheet(); return; }
  if (t.dataset.book) { const bk = t.dataset.book === 'mine' && hasMine() ? 'mine' : 'fam'; state.book = bk; state.instCard = ''; try { localStorage.setItem(BOOKKEY, bk); } catch(e){} render(); window.scrollTo(0, 0); return; }
  if ('icard' in t.dataset) { state.instCard = t.dataset.icard; state.mtab = 'inst'; if (!$('#sheet').hidden) closeSheet(); renderView(); window.scrollTo(0, 0); return; }
  if (t.dataset.mtab) { state.mtab = t.dataset.mtab; renderView(); window.scrollTo(0, 0); return; }
  if (t.dataset.mdetail) { const md = t.dataset.mdetail; if (md.startsWith('flow|')) flowSheet(md.slice(5)); else detailSheet(md); return; }
  if (t.dataset.acct) { acctSheet(t.dataset.acct); return; }
  if (t.dataset.cycStart) { if (cycOwner()) cycStart(t.dataset.cycStart).then(() => { if (!$('#sheet').hidden) cycSheet(); }).catch(fail); return; }
  if (t.dataset.cycEnd) { if (cycOwner()) cycEnd(t.dataset.cycEnd).catch(fail); return; }
  if (t.dataset.cycEdit) { cycEdit(t.dataset.cycEdit); return; }
  if (t.hasAttribute('data-cyc-new')) { cycEdit(''); return; }
  if (t.hasAttribute('data-cycsheet')) { if (cycOwner()) cycSheet(); return; }
  if (t.dataset.balance) { if (!state.readOnly) balanceSheet(t.dataset.balance); return; }
  if (t.hasAttribute('data-addfixed')) { editFixed(null); return; }
  if (t.dataset.fixed) { editFixed(t.dataset.fixed); return; }
  if (t.hasAttribute('data-catgoal')) { catGoalSheet(); return; }
  if (t.hasAttribute('data-savegoal')) { saveGoalSheet(); return; }
  if (t.hasAttribute('data-export')) { exportSheet(); return; }
  if (t.hasAttribute('data-bell')) { bellSheet(); return; }
  if (t.hasAttribute('data-seenall')) { markSeen(); return; }
  if (t.hasAttribute('data-reconnect')) { try { localStorage.setItem('fc-longpoll', '1'); } catch(e){} location.reload(); return; }
  if (t.hasAttribute('data-sync')) { syncHelp(); return; }
  if (t.hasAttribute('data-migrate')) { migrateLocal(); return; }
  if (t.hasAttribute('data-noticelist')) { navTo('notice'); return; }
  if (t.hasAttribute('data-annivlist')) { annivList(); return; }
  if (t.hasAttribute('data-addanniv')) { editAnniv(null); return; }
  if (t.dataset.anniv) { editAnniv(t.dataset.anniv); return; }
  if (t.hasAttribute('data-people')) { togglePop(t); return; }
  if (t.dataset.pf) { state.filter = t.dataset.pf; closePop(); render(); return; }
  if (t.dataset.ev) { editEvent(t.dataset.ev); return; }
  if (t.dataset.work) { editWork(t.dataset.work); return; }
  if (t.dataset.cyc != null) {
    const d = state.drafts[+t.dataset.cyc];
    d._i = (d._i + 1) % d._opts.length; d.people = d._opts[d._i].slice(); d.cat = catFromPeople(d.people); d._override = d.people;
    t.style.setProperty('--c', evColors(d)[0]); t.textContent = evLabel(d); return;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
const step = dir => {
  if (state.view === 'notice') return;
  const c = state.cursor;
  state.cursor = state.view === 'month' || state.view === 'money' ? new Date(c.getFullYear(), c.getMonth()+dir, 1) : addDays(c, state.view==='week' ? 7*dir : dir);
  render(); renderPreview();
};
$('#prev').addEventListener('click', () => step(-1));
/* 스와이프: 좌우 = 이전·다음 기간, 위아래 = 월·주·일·공지 */
const VIEWS = ['month','week','day','notice','money'];
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
function slide(cls){ if (reduceMotion) return; const v = $('#view'); v.classList.remove('swl','swr','swu','swd'); void v.offsetWidth; v.classList.add(cls); }
let tStart = null;
const mainEl = document.querySelector('main');
mainEl.addEventListener('touchstart', e => {
  tStart = null;
  if (e.touches.length !== 1 || !$('#sheet').hidden) return;
  if (e.target.closest('input,textarea,select,.tablewrap')) return;
  const t = e.touches[0], de = document.documentElement;
  tStart = { x:t.clientX, y:t.clientY, at:Date.now(), top: window.scrollY <= 2, bottom: window.innerHeight + window.scrollY >= de.scrollHeight - 2 };
}, { passive:true });
mainEl.addEventListener('touchend', e => {
  if (!tStart) return;
  const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y, dt = Date.now() - tStart.at, st = tStart;
  tStart = null;
  if (dt > 700) return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (state.view === 'notice' || state.q.trim()) return;
    step(dx < 0 ? 1 : -1); slide(dx < 0 ? 'swl' : 'swr');
  } else if (Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.5 && !state.q.trim()) {
    const i = VIEWS.indexOf(state.view) + (dy < 0 ? 1 : -1);
    if (i < 0 || i >= VIEWS.length) return;
    if ((dy < 0 && !st.bottom) || (dy > 0 && !st.top)) return;
    navTo(VIEWS[i]); slide(dy < 0 ? 'swu' : 'swd');
  }
}, { passive:true });
$('#next').addEventListener('click', () => step(1));
$('#today').addEventListener('click', () => { state.cursor = today0(); render(); renderPreview(); });
$('#workMode').addEventListener('click', () => { state.workMode = !state.workMode; if (state.workMode) state.view = 'month'; render(); toast(state.workMode ? '근무 입력 모드 켜짐' : '근무 입력 모드 꺼짐'); });
$('#openSettings').addEventListener('click', settings);
$('#quick').addEventListener('input', () => { renderPreview(); autosize(); });
$('#quick').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addDrafts(); } });
$('#addBtn').addEventListener('click', addDrafts);

// 뷰 상태 기억 (이 기기)
const wantNews = location.hash === '#news';
state.view = 'month'; state.cursor = today0();
const _render = render;
render = function(){ _render(); try { localStorage.setItem('dasom-cal-view', state.view); } catch(e){}
  if (!sheetHashed && location.hash.slice(1) !== viewHash()) { try { history.replaceState(null, '', '#' + viewHash()); } catch(e){} } };
try { history.replaceState(null, '', '#' + viewHash()); } catch(e){}

boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
</script>
