name: 휴대폰 알림 보내기
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --prefix push --omit=dev --no-audit --no-fund
      - run: node push/send.mjs
        env:
          TZ: Asia/Seoul
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
