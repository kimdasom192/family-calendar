name: 점검 (한 번 실행)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --prefix push --omit=dev --no-audit --no-fund
      - run: node push/diag.mjs
        env:
          TZ: Asia/Seoul
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
